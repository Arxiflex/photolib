# Nginx Proxy Manager: a proxy host for photolibd's address (scheme http, port 8080) with "Force SSL" and "HTTP/2
# Support" on, and this in its "Advanced" tab. Uploads arrive in pieces of up to 32 MiB and pass through as they
# come; responses (video, events) stream for up to an hour.
proxy_http_version 1.1;
client_max_body_size 0;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
# Prometheus and photolibd doctor reach photolibd directly, never through here (ADR-0046).
location ~ /(metrics|diagnostics)$ {
    return 403;
}
