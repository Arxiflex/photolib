          type: integer
          title: backup_silent_hours
          description: A device that has not reported its backup for this many hours is silent, 1 to 8760; 0 in an update keeps it.
        minFreeDiskGb:
          type: integer
          title: min_free_disk_gb
          description: The free space in GB (10^9 bytes) below which uploads pause, if less than min_free_disk_percent; 0 to 100000.
