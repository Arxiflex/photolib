# Prometheus with the example alerts and Grafana with the Photolib dashboard, for photolibd on this host
# (docs/admin/monitoring.md). On the host network Prometheus reaches photolibd's listener on loopback; both listen on
# loopback only themselves. Put GRAFANA_ADMIN_PASSWORD and METRICS_TOKEN, photolibd's metrics.token, in .env next to
# this file.
name: photolib-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    secrets:
      - metrics_token
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/observability/.env}
      # Grafana calls home unless told not to.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    restart: unless-stopped

secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  prometheus:
  grafana:
