[package]
name = "photolib-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "photolib"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.2"
buffa = "0.9.2"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
http = "1.4.0"
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
photolib-ignore = { path = "../photolib-ignore" }
photolib-proto = { path = "../photolib-proto" }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
url = "2.5.8"
uuid = "1.26.1"

[dev-dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
buffa-types = "0.9.2"
photolib-db = { path = "../photolib-db", features = ["testing"] }
photolib-server = { path = "../photolib-server" }
photolib-spawn = { path = "../photolib-spawn" }
photolib-storage = { path = "../photolib-storage" }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["process", "io-util", "net", "time", "test-util"] }
