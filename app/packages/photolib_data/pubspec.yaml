name: photolib_data
description: The local store (drift on SQLite3MultipleCiphers under the device data key), its migrations and the data isolate that writes it.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.2
  ffi: ^2.1.0
  fixnum: ^1.1.1
  photolib_api:
    path: ../photolib_api
  photolib_kernel:
    path: ../photolib_kernel
  photolib_log:
    path: ../photolib_log
  photolib_ml:
    path: ../photolib_ml
  photolib_workers:
    path: ../photolib_workers
  protobuf: ^6.1.0
  sqlite3: ^3.7.1
  stream_channel: ^2.1.4
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.4.0
  dart_code_linter: ^4.4.2
  drift_dev: ^2.35.1
  image: ^4.12.0
  photolib_harness:
    path: ../photolib_harness
  test: ^1.25.0
  very_good_analysis: ^11.0.0

# The engine on every native target; the web loads sqlite3mc.wasm (tools/data/web.sh). Only the root package's
# defines count, so the app's pubspec.yaml repeats this.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
    # Its tests load the kernel cargo builds from this checkout (photolib_kernel/testing.dart).
    photolib_kernel:
      bundle: false
    # And ONNX Runtime from tools/ml/fetch.py's cache.
    photolib_ml:
      bundle: false
