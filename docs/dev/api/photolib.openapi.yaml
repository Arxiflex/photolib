      title: StartTotpSetupResponse
      additionalProperties: false
      description: The secret to give the authenticator app.
    photolib.api.v1.StoreScrub:
      type: object
      properties:
        store:
          type: string
          title: store
        cycleEndedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: cycle_ended_at
          description: When it last finished checking every file of the store; absent before its first cycle ends.
      title: StoreScrub
      additionalProperties: false
      description: Where a store's scrub is.
    photolib.api.v1.StoreStatus:
      type: object
      properties:
        name:
          type: string
          title: name
        status:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.CheckStatus'
          title: status
        detail:
          type: string
          title: detail
          description: 'What the check found, in English for the administrator: the marker''s store id, or why the store is offline.'
        freeBytes:
          type:
            - string
            - "null"
          title: free_bytes
          format: int64
          description: Free space on a filesystem store; absent on an object store.
      title: StoreStatus
      additionalProperties: false
      description: A store as checked now.
    photolib.api.v1.SyncRequest:
      type: object
      properties:
        streams:
          type: array
          items:
            $ref: '#/components/schemas/photolib.sync.v1.StreamCursor'
          title: streams
      title: SyncRequest
      additionalProperties: false
      description: The streams to sync, each with its cursor.
    photolib.api.v1.SyncResponse:
      type: object
      properties:
        batch:
          allOf:
            - $ref: '#/components/schemas/photolib.sync.v1.SyncBatch'
          title: batch
      title: SyncResponse
      additionalProperties: false
      description: One batch of one stream.
    photolib.api.v1.TailLogsRequest:
      type: object
      properties:
        lineCount:
          type: integer
          title: line_count
          description: At most 1000; 0 means 200.
      title: TailLogsRequest
      additionalProperties: false
      description: How many lines to return.
    photolib.api.v1.TailLogsResponse:
      type: object
      properties:
        lines:
          type: array
          items:
            type: string
          title: lines
      title: TailLogsResponse
      additionalProperties: false
      description: The newest lines, oldest first.
    photolib.api.v1.TextRegion:
      type: object
      properties:
        text:
          type: string
          title: text
          description: The line, as data (never markup).
        x:
          type: number
          title: x
          format: float
          description: The box's left and top edges, 0 to 1.
        y:
          type: number
          title: y
          format: float
        width:
          type: number
          title: width
          format: float
          description: Its width and height, 0 to 1.
        height:
          type: number
          title: height
          format: float
      title: TextRegion
      additionalProperties: false
      description: A line of text and its box, as fractions of the width and height of the current version of the picture.
    photolib.api.v1.TimelineDay:
      type: object
      properties:
        libraryId:
          type: string
          title: library_id
        date:
          type: string
          title: date
          description: The local capture date, e.g. "2025-07-14"; empty for assets without a capture time.
        count:
          type: integer
          title: count
      title: TimelineDay
      additionalProperties: false
      description: How many assets of a library the timeline shows on one local capture day.
    photolib.api.v1.UnlockKind:
      type: string
      title: UnlockKind
      enum:
        - UNLOCK_KIND_UNSPECIFIED
        - UNLOCK_KIND_PASSWORD
        - UNLOCK_KIND_RECOVERY
      description: A way into the AMK.
    photolib.api.v1.UnlockPath:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.UnlockKind'
          title: kind
        wrap:
          type: string
          title: wrap
          format: byte
          description: |-
            A PLW of the AMK (wrapped type 1) under the path's key: its wrapped_key_id is the AMK's key_id, as in every
             path's, and its wrapping_key_id the path key's. Empty in GetKeys for the password.
        params:
          type: string
          title: params
          format: byte
          description: The password's Argon2id parameters, 26 bytes within the account policy; empty for other kinds.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: UnlockPath
      additionalProperties: false
      description: The AMK wrapped for one way in.
    photolib.api.v1.UpdatePolicyRequest:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        libraryId:
          type: string
          title: library_id
        capability:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.Capability'
          title: capability
        enabled:
          type:
            - boolean
            - "null"
          title: enabled
