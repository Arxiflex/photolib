# photolibd behind nginx 1.18+. As /etc/nginx/templates/photolib.conf.template of the nginx image, ${PHOTOLIB_DOMAIN},
# ${PHOTOLIB_BASE_PATH} (empty, or photolibd's base_path such as /photos) and ${PHOTOLIB_UPSTREAM} (host:port) come from
# the environment; elsewhere replace them. The certificate is certbot's.
server {
    listen 80;
    server_name ${PHOTOLIB_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${PHOTOLIB_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/${PHOTOLIB_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PHOTOLIB_DOMAIN}/privkey.pem;

    # Prometheus and photolibd doctor reach photolibd directly, never through here (ADR-0046).
    location = ${PHOTOLIB_BASE_PATH}/metrics { return 403; }
    location = ${PHOTOLIB_BASE_PATH}/diagnostics { return 403; }

    location ${PHOTOLIB_BASE_PATH}/ {
        proxy_pass http://${PHOTOLIB_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads arrive in pieces of up to 32 MiB and pass through as they come; responses (video, events) stream
        # for up to an hour.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
