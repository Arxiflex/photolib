# Licence allow-list for third-party dependencies (ADR-0013, docs/adr/0013-licence.md): anything not listed is denied.
# `cargo deny check` enforces it for Rust crates, tools/dart_licenses.py for Dart and tools/node_licenses.py for npm
# packages; tools/check.sh runs all three.
# Adding a licence is a reviewed change to this file; a copyleft, source-available or non-commercial one also needs an
# amendment to the ADR.

[advisories]
yanked = "deny"

[licenses]
allow = [
  "AGPL-3.0-only", # our own licence, declared by every first-party manifest
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# libFuzzer's own NCSA licence, only in kernel/fuzz, which never ships (ADR-0189).
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
