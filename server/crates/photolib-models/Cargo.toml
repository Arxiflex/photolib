[package]
name = "photolib-models"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
http = "1.4.0"
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["time"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
futures = "0.3.34"
photolib-spawn = { path = "../photolib-spawn" }
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread"] }
