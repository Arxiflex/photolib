[package]
name = "photolib-ml"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Pinned exactly (design 09 §3.2): a release candidate; it loads the ONNX Runtime 1.31 library the administrator installs.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-31", "tracing", "cuda", "openvino", "migraphx", "coreml"] }
photolib-kernel = { path = "../../../kernel" }
photolib-models = { path = "../photolib-models" }
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
photolib-spawn = { path = "../photolib-spawn", optional = true }
serde_json = { version = "1.0.154", optional = true }
tempfile = { version = "3.27.0", optional = true }

[features]
# `testing`: a fake runtime, and ONNX Runtime with the registry's models, for photolibd's tests.
testing = ["dep:photolib-spawn", "dep:serde_json", "dep:tempfile"]

[dev-dependencies]
photolib-ml = { path = ".", features = ["testing"] }
# JPEG decoding for the face photographs of the tests, PNG for the text
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
