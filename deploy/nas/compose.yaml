# Photolib on a NAS: photolibd and PostgreSQL, photolibd on port 8080 for the NAS's own reverse proxy or the LAN
# (docs/admin/install.md#on-a-nas). Synology Container Manager and Portainer read the settings from .env beside it;
# TrueNAS's "Install via YAML" takes the file with the ${...} replaced. Make data/, keys/ and postgres/ owned by
# PUID:PGID first.
name: photolib

services:
  photolibd:
    image: ghcr.io/arxiflex/photolib:0.1.0
    user: ${PUID:-1000}:${PGID:-1000}
    read_only: true
    restart: unless-stopped
    environment:
      PHOTOLIB_DATABASE__URL: postgres://photolib:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/photolib
      PHOTOLIB_PUBLIC_URL: ${PHOTOLIB_PUBLIC_URL:?set PHOTOLIB_PUBLIC_URL, such as http://nas.local:8080}
      PHOTOLIB_OPAQUE_KEY_FILE: /keys/opaque.key
    ports: ["${HTTP_PORT:-8080}:8080"]
    volumes:
      - ./data:/data
      - ./keys:/keys
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: ${PUID:-1000}:${PGID:-1000}
    read_only: true
    restart: unless-stopped
    environment:
      POSTGRES_USER: photolib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql
    tmpfs: [/tmp, /var/run/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, photolib]
      interval: 5s
