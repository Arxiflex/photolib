targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            replica: lib/src/replica.dart
          generate_manager: false
          skip_verification_code: true
          data_class_to_companions: false
          schema_dir: drift_schemas/
          test_dir: test/drift/
          sql:
            dialect: sqlite
            options:
              version: "3.45"
