# photolibd behind Apache httpd 2.4.47+ with mod_ssl, mod_http2, mod_proxy_http, mod_headers and mod_alias
# (a2enmod ssl http2 proxy_http headers alias). ${PHOTOLIB_DOMAIN}, ${PHOTOLIB_BASE_PATH} (empty, or photolibd's
# base_path such as /photos) and ${PHOTOLIB_UPSTREAM} (host:port) come from the environment (Debian: export them in
# /etc/apache2/envvars), or replace them. The certificate is certbot's.
<VirtualHost *:80>
    ServerName ${PHOTOLIB_DOMAIN}
    Redirect permanent / https://${PHOTOLIB_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName ${PHOTOLIB_DOMAIN}
    Protocols h2 http/1.1
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/${PHOTOLIB_DOMAIN}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${PHOTOLIB_DOMAIN}/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto https
    # Uploads arrive in pieces of up to 32 MiB; responses (video, events) stream for up to an hour.
    LimitRequestBody 0
    ProxyTimeout 3600
    ProxyPass ${PHOTOLIB_BASE_PATH}/ http://${PHOTOLIB_UPSTREAM}${PHOTOLIB_BASE_PATH}/
    # Prometheus and photolibd doctor reach photolibd directly, never through here (ADR-0046).
    <LocationMatch "^${PHOTOLIB_BASE_PATH}/(metrics|diagnostics)$">
        Require all denied
    </LocationMatch>
</VirtualHost>
