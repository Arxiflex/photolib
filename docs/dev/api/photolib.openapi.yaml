    photolib.api.v1.UserStatus:
      type: string
      title: UserStatus
      enum:
        - USER_STATUS_UNSPECIFIED
        - USER_STATUS_ACTIVE
        - USER_STATUS_DISABLED
        - USER_STATUS_INVITED
        - USER_STATUS_DELETED
      description: Whether an account may sign in.
