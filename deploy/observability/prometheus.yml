# Scrapes photolibd at its default address with its metrics token and evaluates the example alerts.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: photolib
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["127.0.0.1:8080"]
