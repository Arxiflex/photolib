    photolib.api.v1.UpdateUserResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.User'
          title: user
      title: UpdateUserResponse
      additionalProperties: false
      description: The account after the change.
    photolib.api.v1.User:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        handle:
          type: string
          title: handle
          description: 'Unique sign-in name: 1 to 64 of a-z, 0-9, ".", "_" and "-", starting with a letter or digit; never changes.'
        displayName:
          type: string
          title: display_name
        email:
          type: string
          title: email
          description: Unique when set; empty means none.
        role:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.UserRole'
          title: role
        status:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.UserStatus'
          title: status
        quotaBytes:
          type:
            - string
            - "null"
          title: quota_bytes
          format: int64
          description: Storage the account may use; absent means unlimited.
        locale:
          type: string
          title: locale
          description: BCP 47 language tag, e.g. "de-CH"; empty means the server's default.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        purgeAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: purge_at
          description: When a deleted account is purged; absent for any other status.
      title: User
      additionalProperties: false
      description: An account on this server.
    photolib.api.v1.UserRole:
      type: string
      title: UserRole
      enum:
        - USER_ROLE_UNSPECIFIED
        - USER_ROLE_ADMIN
        - USER_ROLE_USER
        - USER_ROLE_VIEWER
