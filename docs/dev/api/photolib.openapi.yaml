      type: object
      properties:
        kitId:
          type: string
          title: kit_id
          format: byte
      title: VerifyRecoveryKitRequest
      additionalProperties: false
      description: The key_id of the KEK_rec the person reached with the kit.
    photolib.api.v1.VerifyRecoveryKitResponse:
      type: object
