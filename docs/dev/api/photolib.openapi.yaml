        keys:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.AccountKeys'
          title: keys
      title: VerifyRecoveryKitResponse
      additionalProperties: false
      description: The keys as stored.
    photolib.api.v1.Webhook:
      type: object
      properties:
        webhookId:
          type: string
          title: webhook_id
        url:
          type: string
          title: url
          description: |-
            http or https, at most 2000 characters, never at a loopback, link-local, unspecified, broadcast or multicast
             address.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        deliveredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: delivered_at
          description: The last delivery that succeeded; absent until then.
        failingSince:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: failing_since
          description: Since when its deliveries fail; absent while they succeed.
        lastStatus:
          type: integer
          title: last_status
          description: The HTTP status of the last failed delivery; 0 when none came.
      title: Webhook
      additionalProperties: false
      description: A URL that the account's events are POSTed to, signed as Standard Webhooks sign them.
    photolib.sync.v1.FieldEdit:
      type: object
      properties:
        entity:
          type: string
          title: entity
          description: |-
            The table, as sync names it: "assets" (title, description, rating, color_label, archived, trashed_at,
             current_version_id: the id of one of the asset's versions, which makes a revert one edit),
             "asset_user_state" (favorite, hidden_from_memories), "album_items" (sort_key) or "albums" (title, description).
             The first edit of an id no album has creates it for the caller under that id.
        id:
          type: string
          title: id
          description: The row's id; of asset_user_state, the asset's.
        fields:
          type: object
          title: fields
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/photolib.sync.v1.Value'
            title: value
          description: |-
            The new value of each field, typed as sync sends it; a value of no kind is NULL. A trashed_at of any time trashes
             the asset at the edit's hlc, NULL restores it.
      title: FieldEdit
      additionalProperties: false
      description: |-
        Sets user fields of one row. Each field keeps the value of its latest edit by hlc, wherever and in whatever order
         the edits arrive (per-field last-writer-wins, design 05 §5).
    photolib.sync.v1.Hlc:
      type: object
      properties:
        physicalMs:
          type: string
          title: physical_ms
          format: int64
          description: Milliseconds since the Unix epoch, UTC.
        counter:
          type: integer
          title: counter
        deviceId:
          type: string
          title: device_id
          description: Device that produced the reading (UUIDv7); breaks ties between equal readings.
      title: Hlc
      additionalProperties: false
      description: 'A hybrid logical clock reading: wall-clock milliseconds plus a counter that orders events within one millisecond.'
    photolib.sync.v1.MemberEdit:
      type: object
      properties:
        entity:
          type: string
          title: entity
          description: |-
            The set's table, as sync names it: "album_items", the assets of an album. An asset's item in an album has the
             UUIDv8 of the first 16 bytes of SHA-256("photolib.album_item" ‖ album id ‖ asset id), ids as 16 bytes, so that
             every device names it alike.
        setId:
          type: string
          title: set_id
          description: 'The set: the album.'
        elementId:
          type: string
          title: element_id
          description: 'The element: the asset.'
        present:
          type: boolean
          title: present
        sortKey:
          type: string
          title: sort_key
          description: |-
            Where an added element goes in the set's custom order: a fractional index key of digits and ASCII letters,
             ordered bytewise, ties by the item's id.
      title: MemberEdit
      additionalProperties: false
      description: |-
        Adds an element to a set or removes it. The latest operation on an element by hlc decides, so an add and a remove
         made offline on two devices end the same everywhere (OR-set semantics, design 05 §5).
    photolib.sync.v1.Mutation:
      type: object
      anyOf:
        - type: object
          properties:
            edit:
              allOf:
                - $ref: '#/components/schemas/photolib.sync.v1.FieldEdit'
              title: edit
          title: edit
        - type: object
          properties:
            member:
              allOf:
                - $ref: '#/components/schemas/photolib.sync.v1.MemberEdit'
              title: member
          title: member
        - type: object
          properties:
            version:
              allOf:
                - $ref: '#/components/schemas/photolib.sync.v1.VersionEdit'
              title: version
          title: version
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - edit
              - required:
                  - member
              - required:
                  - version
          - not:
              oneOf:
                - required:
                    - edit
                - required:
                    - member
                - required:
                    - version
      properties:
        mutationId:
          type: string
          title: mutation_id
          description: 'Idempotency key (UUIDv7): the server ignores a mutation_id it has already applied.'
        hlc:
          allOf:
            - $ref: '#/components/schemas/photolib.sync.v1.Hlc'
          title: hlc
        recordedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: recorded_at
          description: When the device recorded the action, for audit trails; ordering always uses hlc.
      title: Mutation
      description: The envelope of one user action sent from a device's outbox.
    photolib.sync.v1.Row:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/photolib.sync.v1.Value'
          title: values
      title: Row
      additionalProperties: false
      description: The values of one row, in the order of its group's columns.
    photolib.sync.v1.Rows:
      type: object
      properties:
        entity:
          type: string
          title: entity
          description: The table, e.g. "assets".
        columns:
          type: array
          items:
            type: string
          title: columns
        rows:
          type: array
          items:
            $ref: '#/components/schemas/photolib.sync.v1.Row'
          title: rows
        deleted:
          type: boolean
          title: deleted
      title: Rows
      additionalProperties: false
      description: 'Rows of one table: upserts, or deletions that carry only the key columns.'
    photolib.sync.v1.StreamCursor:
      type: object
      properties:
        stream:
          type: string
          title: stream
          description: The stream, e.g. "account", "libraries" or "assets/<library id>".
        cursor:
          type: string
          title: cursor
          format: byte
          description: The cursor of the stream's last applied batch; empty starts it from scratch, with a snapshot.
      title: StreamCursor
      additionalProperties: false
      description: Where a device stands in one stream (design 05 §3).
    photolib.sync.v1.StreamStatus:
      type: string
      title: StreamStatus
      enum:
        - STREAM_STATUS_UNSPECIFIED
        - STREAM_STATUS_OK
        - STREAM_STATUS_RESET_REQUIRED
        - STREAM_STATUS_FORBIDDEN
      description: What became of a stream.
    photolib.sync.v1.SyncBatch:
      type: object
      properties:
        stream:
          type: string
          title: stream
        status:
          allOf:
            - $ref: '#/components/schemas/photolib.sync.v1.StreamStatus'
          title: status
        changes:
          type: array
          items:
            $ref: '#/components/schemas/photolib.sync.v1.Rows'
          title: changes
        cursor:
          type: string
          title: cursor
          format: byte
        caughtUp:
          type: boolean
          title: caught_up
          description: 'The stream has caught up: this is its last batch of the call.'
      title: SyncBatch
      additionalProperties: false
      description: Changes of one stream that a device applies in one transaction, then stores `cursor`.
    photolib.sync.v1.Value:
      type: object
      anyOf:
        - type: object
          properties:
            blob:
              type: string
              title: blob
              format: byte
          title: blob
        - type: object
          properties:
            boolean:
              type: boolean
              title: boolean
          title: boolean
        - type: object
          properties:
            integer:
              type: string
              title: integer
              format: int64
          title: integer
        - type: object
          properties:
            real:
              type: number
              title: real
              format: double
          title: real
        - type: object
          properties:
            text:
              type: string
              title: text
          title: text
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - blob
              - required:
                  - boolean
              - required:
                  - integer
              - required:
                  - real
              - required:
                  - text
          - not:
              oneOf:
                - required:
                    - blob
                - required:
                    - boolean
                - required:
                    - integer
                - required:
                    - real
                - required:
                    - text
      title: Value
      description: |-
        One column of a row: uuids, text, dates, JSON and arrays (as JSON) are text, times are integer milliseconds since
         the Unix epoch, UTC; no kind is NULL.
    photolib.sync.v1.VersionEdit:
      type: object
      properties:
        assetId:
          type: string
          title: asset_id
          description: The asset edited (UUIDv7); a standard library's, since a private library keeps its recipes on devices.
        versionId:
          type: string
          title: version_id
          description: The new version's id (UUIDv7), made by the device so that it can name the version offline.
        parentId:
          type: string
          title: parent_id
          description: The version this edit continues, one of the asset's; empty for none.
        label:
          type: string
          title: label
          description: What the user called it; at most 200 characters.
        recipe:
          type: string
          title: recipe
          format: byte
          description: The `photolib.model.v1.EditRecipe`, encoded; the server checks it with the kernel and keeps its canonical form.
      title: VersionEdit
      additionalProperties: false
      description: |-
        Adds an immutable version to an asset's history: the recipe of one edit of the asset's picture (roadmap M8-01,
         ADR-0391). It is an insert, never merged: a version id the server holds already is the same version (its recipe must
         be the same) and nothing happens. Making the version the asset's current one is a separate `FieldEdit` of
         `assets.current_version_id`, sent after it, so that a revert to any version is the same edit.
security: []
tags:
  - name: photolib.api.v1.AdminService
    description: 'Runs the server, for its administrators: the admin console (OPS-02). Changes are recorded in the audit log.'
  - name: photolib.api.v1.ApiKeyService
    description: The caller's API keys, which only the account signed in, never a key, manages.
  - name: photolib.api.v1.KeyService
    description: |-
      The keys of private mode (design 06 §4 and §6, ADR-0255): an account's identity, its account master key (AMK)
       wrapped once per unlock path, and its recovery kit. Clients make and wrap every key; the server keeps the wraps and
       reads only their headers, so nothing it holds opens anything. It accepts no upload to a private library from an
       account with fewer than two unlock paths or an unverified recovery kit (`keys.recovery_incomplete`).
  - name: photolib.api.v1.AuthService
    description: |-
      Signs devices in with a password the server never learns: OPAQUE (RFC 9807) with the configuration of
       docs/dev/crypto-v1.md#opaque. A wrong password, an unknown handle or email and an account that cannot sign in look the same,
       and a handle, a known device or an address with too many attempts is locked for a growing time (`login.throttled`,
       `retry_after_seconds`).
       An account with a passkey or TOTP finishes a password sign-in with one of them or a recovery code; a passkey that
       verifies its user signs in alone. WebAuthn options and credentials travel in WebAuthn's own JSON serialisation
       (Level 3), which browsers and Android take and give as they are; their ceremonies run on photolibd's `public_url`.
       While the admin console's `require_two_factor` is on, a session of an account without a second factor is refused
       everything but this service (`second_factor.required`), where it enrols one.
       DeletePasskey, DeleteTotp, CreateRecoveryCodes, replacing a TOTP secret, adding a passkey and setting a password with a
       session need the calling session to have proved its person within the last five minutes (`permission_denied`
       `step_up.required`): a sign-in with a password, a passkey or a second factor counts, and so does StartStepUp and
       FinishStepUp. A first TOTP secret, and a passkey or password for an account with nothing to prove itself with yet,
       need no proof.
       A session token is sent as `Authorization: Bearer <token>`; the server keeps only its hash.
  - name: photolib.api.v1.EventService
    description: The events of the assets the caller may view, in order, kept for 7 days. Integrations poll it with a key.
  - name: photolib.api.v1.WebhookService
    description: The caller's webhooks, which only the account signed in, never an API key, manages; at most 10.
  - name: photolib.api.v1.FaceService
    description: |-
      Faces in photos and videos (ADR-0389). Nothing is found, stored or computed about faces for an account that has not
       agreed to the notice: the account's consent is the one switch, and withdrawing it deletes what was found.
  - name: photolib.api.v1.SearchService
    description: Search over what the server knows of the assets the caller may view.
  - name: photolib.api.v1.ServerInfoService
    description: What a client needs to know before it talks to a server.
  - name: photolib.api.v1.SyncService
    description: Replicates what an account may see to its devices, and tells a backup what is already there (design 05).
  - name: photolib.api.v1.SetupService
    description: Turns a new server into a working one. Needs no sign-in.
  - name: photolib.api.v1.UserService
    description: The accounts of this server, for its administrators. Every change is recorded in the audit log.
