[package]
name = "photolib-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The generated Connect clients; the server needs only the services.
client = ["connectrpc/client"]

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
