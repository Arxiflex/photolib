name: photolib
description: "Photolib: one gallery app for Android, iOS, Windows, macOS, Linux and the web."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.0.7
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  ffi: ^2.1.0
  file_selector_android: ^0.5.2+11
  file_selector_ios: ^0.5.3+6
  file_selector_linux: ^0.9.4+1
  file_selector_macos: ^0.9.5+1
  file_selector_platform_interface: ^2.7.0
  file_selector_web: ^0.9.5
  file_selector_windows: ^0.9.3+6
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_ui: ^1.7.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  path_provider: ^2.1.6
  photolib_api:
    path: packages/photolib_api
  photolib_data:
    path: packages/photolib_data
  photolib_editor:
    path: packages/photolib_editor
  photolib_kernel:
    path: packages/photolib_kernel
  photolib_log:
    path: packages/photolib_log
  photolib_ml:
    path: packages/photolib_ml
  photolib_workers:
    path: packages/photolib_workers
  protobuf: ^6.1.0
  qr: ^4.0.0
  sensors_plus: ^7.1.1
  video_player: ^2.14.1
  video_player_platform_interface: ^6.9.0
  video_player_web: ^2.4.0
  wakelock_plus: ^1.8.1
  web: ^1.1.1
  xml: ^7.1.0

dev_dependencies:
  dart_code_linter: ^4.4.2
  drift: ^2.35.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  photolib_harness:
    path: packages/photolib_harness
  sqlite3: ^3.7.1
  stream_channel: ^2.1.4
  very_good_analysis: ^11.0.0

# The engine of the replica on every native target, as in packages/photolib_data; only the app's defines count.
# Until a kernel-v* release is pinned (ADR-0026), the kernel is the one tools/kernel/build.py writes into build/kernel/.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
    photolib_kernel:
      artifacts: build/kernel/
    # ONNX Runtime's pinned archives (tools/ml/artefacts.json); the hook downloads one that is missing.
    photolib_ml:
      runtime: build/onnxruntime/

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Roboto-LICENSE.txt
  shaders:
    - shaders/sphere.frag
  # Bundled so the web app never fetches it from a CDN (docs/dev/flutter.md).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
