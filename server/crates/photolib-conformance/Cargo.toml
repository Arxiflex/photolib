[package]
name = "photolib-conformance"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false }
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["json"] }
futures = "0.3.34"
http = "1.5.0"
photolib-server = { path = "../photolib-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "io-std", "io-util"] }
tokio-util = "0.7.20"

# The code connectrpc-build generates uses serde and serde_json.
[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]

[build-dependencies]
connectrpc-build = "0.9.0"
prost = "0.14.1"
protox = "0.10.0"
