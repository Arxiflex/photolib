[package]
name = "photolib-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "photolibd"
path = "src/main.rs"

# The hot paths in CPU instructions (tools/perf/instructions.sh).
[[bench]]
name = "instructions"
harness = false

[dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
blake3 = "1.8.2"
buffa = "0.9.2"
buffa-types = "0.9.2"
photolib-authz = { path = "../photolib-authz" }
photolib-media = { path = "../photolib-media" }
half = "2.4"
photolib-ml = { path = "../photolib-ml" }
photolib-models = { path = "../photolib-models" }
bytes = "1.12.1"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "matched-path"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["axum", "gzip", "json", "zstd"] }
figment = { version = "0.10.19", features = ["env"] }
futures = "0.3.34"
getrandom = "0.4.3"
hmac = "0.12.1"
httpdate = "1.0.3"
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
photolib-db = { path = "../photolib-db" }
photolib-ignore = { path = "../photolib-ignore" }
photolib-jobs = { path = "../photolib-jobs" }
photolib-kernel = { path = "../../../kernel" }
photolib-proto = { path = "../photolib-proto" }
photolib-storage = { path = "../photolib-storage" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "figment"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
socket2 = "0.6.5"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "std", "fmt"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
url = "2.5.8"
prometheus-client = "0.25.1"
prost = "0.14"
prost-types = "0.14"
nix = { version = "0.31.3", features = ["fs", "inotify", "poll"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "hyper-client"] }
opentelemetry-http = { version = "0.33.1", default-features = false, features = ["hyper"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
httparse = "1.10.1"
nix = { version = "0.31.3", features = ["sched", "signal", "time"] }
photolib-db = { path = "../photolib-db", features = ["testing"] }
photolib-ml = { path = "../photolib-ml", features = ["testing"] }
photolib-spawn = { path = "../photolib-spawn" }
photolib-storage = { path = "../photolib-storage", features = ["testing"] }
rs-vips = "0.7.0"
thumbhash = "0.1.0"
tokio = { version = "1.53.3", features = ["test-util"] }
