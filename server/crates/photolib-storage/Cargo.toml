[package]
name = "photolib-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# A throwaway Garage for the tests of this and other crates.
testing = ["dep:photolib-spawn"]

[dependencies]
async-trait = "0.1.92"
blake3 = "1.8.2"
bytes = "1.12.1"
http = "1.4.0"
jiff = "0.2.15"
futures = "0.3.34"
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
opendal = { version = "0.59.4", default-features = false, features = ["services-s3", "executors-tokio"] }
percent-encoding = "2.3.2"
photolib-spawn = { path = "../photolib-spawn", optional = true }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
reqsign-aws-v4 = { version = "3.3.0", default-features = false }
reqsign-core = { version = "3.3.1", default-features = false }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[dev-dependencies]
photolib-storage = { path = ".", features = ["testing"] }
photolib-db = { path = "../photolib-db", features = ["testing"] }
rustix = { version = "1.1.5", features = ["process"] }
