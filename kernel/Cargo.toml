[package]
name = "photolib-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

[workspace]
members = ["ffi", "wasm"]
default-members = [".", "ffi", "wasm"]

[workspace.lints.rust]
# Unsafe code only in the C ABI (ffi) and the counting allocator of tests/fuzz.rs, which allow it (threat model T13);
# the library and the WASM binding forbid it in their roots.
unsafe_code = "deny"
# The project's rules (docs/dev/lint.md): warnings, which tools/lint/ratchet.sh fails on unless its baseline holds them.
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Crash classes; tools/lint/ratchet.py counts them in the code that ships, not in tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
unreachable = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
let_underscore_must_use = "warn"
# The lints the project rejects, each for a reason:
# what fails is the error type's to say, and panics are denied above, so no `# Errors` or `# Panics` sections;
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# #[must_use] and const fn are promises a function makes where its callers need them, not wherever it could;
must_use_candidate = "allow"
missing_const_for_fn = "allow"
# docs name products and formats (PhotoKit, MediaStore) in prose, and open with a paragraph of any length;
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
# contradicts rustc's unreachable_pub, which the project keeps;
redundant_pub_crate = "allow"
# known false positives (rust-clippy#9399, #8547), and matches that read better than map_or_else chains.
significant_drop_tightening = "allow"
similar_names = "allow"
option_if_let_else = "allow"

[lints]
workspace = true

[dependencies]
# No default features: the kernel takes its randomness from the caller and never calls getrandom.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
curve25519-dalek = { version = "5", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
hkdf = "0.13"
hmac = "0.13"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "chacha", "mlkem"] }
libm = "0.2"
md-5 = { version = "0.11", default-features = false }
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
prost = "0.14"
prost-types = "0.14"
rand_core = { version = "0.10", default-features = false }
regex-lite = "0.1"
sha2 = { version = "0.11", default-features = false }
# OPAQUE's key exchange hash, of the digest version opaque-ke takes.
sha512 = { package = "sha2", version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
thumbhash = "0.1.0"
unicode-normalization = { version = "0.1", default-features = false }
zeroize = "1"

[dev-dependencies]
serde_json = "1"

# md-5's library is md5, which cargo-machete does not know.
[package.metadata.cargo-machete]
ignored = ["md-5"]

# The hot paths in CPU instructions (tools/perf/instructions.sh).
[[bench]]
name = "instructions"
harness = false

# Unoptimised, Argon2id at the device floor (64 MiB) takes minutes, streaming megabytes and fuzzing logs and wraps take
# seconds; tests do all of them.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
chacha20.opt-level = 3
curve25519-dalek.opt-level = 3
keccak.opt-level = 3
ml-kem.opt-level = 3
poly1305.opt-level = 3
sha2.opt-level = 3

# An integer that overflows panics in tests and releases too, never wraps silently (docs/dev/lint.md).
[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

# One codegen unit lets the compiler share the generic code that the 16 units would each instantiate, which takes about
# 14% off the native libraries: ADR-0004's budget of 3,000,000 bytes per ABI counts them.
[profile.release.package.photolib-kernel]
codegen-units = 1
