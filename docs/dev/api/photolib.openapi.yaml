    photolib.api.v1.UpdateSettingsRequest:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.Settings'
          title: settings
      title: UpdateSettingsRequest
      additionalProperties: false
      description: The new settings, every field.
    photolib.api.v1.UpdateSettingsResponse:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.Settings'
          title: settings
      title: UpdateSettingsResponse
      additionalProperties: false
      description: The settings as stored.
    photolib.api.v1.UpdateUserRequest:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.User'
