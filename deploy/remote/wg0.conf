# WireGuard on the server's machine: one UDP port (51820) open on its router, or on a hub both sides reach. Each device
# is a [Peer]; the apps then add http://10.8.0.1:8080 (docs/admin/remote-access.md). Make keys with
# `wg genkey | tee private | wg pubkey`; never commit them.
[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <the server's private key>

[Peer]
# A phone
PublicKey = <the phone's public key>
AllowedIPs = 10.8.0.2/32
