openapi: 3.1.0
info:
  title: Photolib API
  version: v1
  description: >-
    The API of a Photolib server, generated from the protobuf package photolib.api.v1 in proto/. Each call is a Connect RPC: an HTTP POST of JSON (application/json) or binary protobuf (application/proto) to /photolib.api.v1.<Service>/<Method>. Errors carry no prose: `code` is the Connect error code and `details` holds a photolib.api.v1.ErrorDetail whose reason code and parameters the client turns into a message in its user's language. GetServerInfo lists the capabilities the server supports; check them before relying on a behaviour.
paths:
  /photolib.api.v1.AdminService/ApplyPreset:
    post:
      tags:
        - photolib.api.v1.AdminService
      summary: ApplyPreset
      description: |-
        Sets the server's switch of every capability the configuration file does not pin as a preset says, and clears what
         accounts and libraries set of them; the switches stay editable.
      operationId: photolib.api.v1.AdminService.ApplyPreset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/photolib.api.v1.ApplyPresetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/photolib.api.v1.ApplyPresetResponse'
