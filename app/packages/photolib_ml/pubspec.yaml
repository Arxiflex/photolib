name: photolib_ml
description: ONNX Runtime for on-device ML through its C API with dart:ffi and, on the web, onnxruntime-web.
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.1.0
  hooks: ^2.0.2

dev_dependencies:
  dart_code_linter: ^4.4.2
  image: ^4.12.0
  photolib_harness:
    path: ../photolib_harness
  stream_channel: ^2.1.4
  test: ^1.25.0
  very_good_analysis: ^11.0.0

# Its tests load ONNX Runtime from tools/ml/fetch.py's cache, so the hook bundles none here.
hooks:
  user_defines:
    photolib_ml:
      bundle: false
