apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "photolib.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "photolib.labels" . | nindent 4 }}
    photolib.org/api: "true"
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
