# Umbrel App Store entry: deploy/nas/compose.yaml in Umbrel's form, behind Umbrel's app proxy.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: photolib_photolibd_1
      APP_PORT: 8080
      # Photolib signs in its own users, and the apps call its API.
      PROXY_AUTH_ADD: "false"

  photolibd:
    image: ghcr.io/arxiflex/photolib:0.1.0
    user: "1000:1000"
    read_only: true
    restart: on-failure
    environment:
      PHOTOLIB_DATABASE__URL: postgres://photolib:${APP_PASSWORD}@postgres/photolib
      PHOTOLIB_PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:3843
      PHOTOLIB_OPAQUE_KEY_FILE: /keys/opaque.key
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/keys:/keys
    tmpfs: [/tmp]
    depends_on: [postgres]

  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "1000:1000"
    read_only: true
    restart: on-failure
    environment:
      POSTGRES_USER: photolib
      POSTGRES_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql
    tmpfs: [/tmp, /var/run/postgresql]
