    photolib.api.v1.Settings:
      type: object
      properties:
        requireTwoFactor:
          type: boolean
          title: require_two_factor
          description: Accounts without a passkey or TOTP can do nothing but set one up (ADR-0088).
        faceRecognitionDefault:
          type: boolean
          title: face_recognition_default
          description: Whether face recognition starts switched on for new accounts; each user may change it.
        trashRetentionDays:
          type: integer
          title: trash_retention_days
          description: How long trashed items stay, 1 to 3650.
        minFreeDiskPercent:
          type: integer
          title: min_free_disk_percent
          description: |-
            Uploads pause while a filesystem they fill has less free space than this share of its size, or than
             min_free_disk_gb if that is less (ADR-0063); 0 to 50.
