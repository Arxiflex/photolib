components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    photolib.api.v1.AccountKeys:
      type: object
      properties:
        identity:
          type: string
          title: identity
          format: byte
          description: The genesis entry of the account's identity log (a PLS signed by its identity signing key).
        signingKey:
          type: string
          title: signing_key
          format: byte
          description: The seeds of the identity's signing and decryption keys, each a PLW under the AMK (wrapped types 8 and 9).
        decryptionKey:
          type: string
          title: decryption_key
          format: byte
        paths:
          type: array
          items:
            $ref: '#/components/schemas/photolib.api.v1.UnlockPath'
          title: paths
        recoveryVerifiedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: recovery_verified_at
          description: When the recovery kit was last verified; unset until it is.
        drillDueAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: drill_due_at
          description: 'When the next recovery drill is due: six months after the last verification.'
        ready:
          type: boolean
          title: ready
          description: 'Two unlock paths and a verified recovery kit: the server accepts private uploads.'
      title: AccountKeys
      additionalProperties: false
      description: An account's keys.
    photolib.api.v1.AccountUsage:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        handle:
          type: string
          title: handle
        assetCount:
          type: string
          title: asset_count
          format: int64
        sizeBytes:
          type: string
          title: size_bytes
          format: int64
      title: AccountUsage
      additionalProperties: false
      description: What an account stores (OPS-21).
    photolib.api.v1.ApiKey:
      type: object
      properties:
        apiKeyId:
          type: string
          title: api_key_id
        name:
          type: string
          title: name
          description: 'What its owner calls it: 1 to 100 printable characters.'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/photolib.api.v1.ApiKeyScope'
          title: scopes
          description: At least one.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: Required, and in the future when the key is created.
        requestsPerMinute:
          type: integer
          title: requests_per_minute
          description: 'Requests the key may make per minute, in bursts of up to as many: 1 to 60000; 0 when creating means 600.'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_used_at
          description: The last request the key made, to the minute; absent until then.
        revokedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: revoked_at
          description: Absent until the key is revoked.
      title: ApiKey
      additionalProperties: false
      description: 'A credential for scripts, the CLI and other programs, which send its secret as `Authorization: Bearer <secret>`.'
    photolib.api.v1.ApiKeyScope:
      type: string
      title: ApiKeyScope
      enum:
        - API_KEY_SCOPE_UNSPECIFIED
        - API_KEY_SCOPE_VIEW
        - API_KEY_SCOPE_DOWNLOAD
        - API_KEY_SCOPE_CONTRIBUTE
        - API_KEY_SCOPE_EDIT
        - API_KEY_SCOPE_DELETE
        - API_KEY_SCOPE_SHARE
        - API_KEY_SCOPE_MANAGE_USERS
        - API_KEY_SCOPE_MANAGE_SERVER
      description: What an API key may do as its account, and only what the account itself may do. No scope manages keys.
    photolib.api.v1.ApplyPresetRequest:
      type: object
      properties:
        preset:
          allOf:
            - $ref: '#/components/schemas/photolib.api.v1.Preset'
          title: preset
      title: ApplyPresetRequest
      additionalProperties: false
      description: The preset to apply.
    photolib.api.v1.ApplyPresetResponse:
      type: object
      properties:
        switches:
          type: array
          items:
